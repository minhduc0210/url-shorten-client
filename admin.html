<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Quản lý URL</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="toast-container" class="fixed top-5 right-5 z-[9999]"></div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
      <h1 class="text-3xl font-black text-gray-800 tracking-tight">Dashboard Quản Trị</h1>
      <div class="flex gap-3">
        <button id="refreshBtn" class="bg-white border border-gray-300 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-50 font-semibold transition">
          Làm mới
        </button>
        <button id="logoutBtn" class="bg-red-50 text-red-600 px-5 py-2.5 rounded-lg hover:bg-red-100 font-semibold transition">
          Đăng xuất
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-800 text-white">
            <tr>
              <th class="px-6 py-4 font-bold uppercase text-xs">ID</th>
              <th class="px-6 py-4 font-bold uppercase text-xs">URL Gốc</th>
              <th class="px-6 py-4 font-bold uppercase text-xs">Mã Rút Gọn</th>
              <th class="px-6 py-4 font-bold uppercase text-xs">Ngày tạo</th>
              <th class="px-6 py-4 font-bold uppercase text-xs text-center">Thao tác</th>
            </tr>
          </thead>
          <tbody id="urlTableBody" class="divide-y divide-gray-100">
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-2xl">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Chỉnh sửa liên kết</h2>
      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editId">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">URL Gốc</label>
          <input type="url" id="editLongUrl" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Mã rút gọn</label>
          <input type="text" id="editShortCode" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
        </div>
        <div class="flex justify-end gap-3 mt-8">
          <button type="button" id="closeModal" class="px-5 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg transition">Hủy</button>
          <button type="submit" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
