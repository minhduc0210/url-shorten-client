<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener - Siêu nhanh</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div id="app" class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl mx-4">
    <h1 class="text-3xl font-extrabold text-center text-indigo-600 mb-8">Rút gọn liên kết</h1>

    <form id="shortenForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">URL gốc của bạn</label>
        <input 
          type="url" id="longUrl" required 
          placeholder="https://example.com/very-long-link"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Bí danh (Tùy chọn)</label>
        <input 
          type="text" id="customAlias" 
          placeholder="my-link"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition"
        />
      </div>

      <button 
        type="submit" id="submitBtn"
        class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transform active:scale-95 transition"
      >
        Tạo Link Ngay
      </button>
    </form>

    <div id="result" class="mt-8 hidden border-t pt-6 border-gray-100">
      <p class="text-sm font-medium text-gray-500 mb-2 text-center">Liên kết đã được rút gọn:</p>
      <div class="flex items-center bg-indigo-50 p-4 rounded-lg border border-indigo-100">
        <a id="shortUrl" href="#" target="_blank" class="text-indigo-600 font-bold truncate flex-1"></a>
        <button id="copyBtn" class="ml-3 text-xs bg-white border border-indigo-200 px-3 py-2 rounded-md hover:bg-indigo-100 font-bold">
          Copy
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-5 right-5 z-50"></div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
